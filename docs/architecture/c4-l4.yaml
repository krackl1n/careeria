components:
  - name: "Application Service"
    slug: "hiring-application-service"
    container: "Hiring Service"
    title: "Application Service (Hiring Domain)"
    description: "Оркестрация воронки отклика, аудит переходов и межагрегатная доменная политика."
    usecase_pkg: "services/hiring/internal/usecase/application"
    domain_pkg: "services/hiring/internal/domain/application"
    policy_pkg: "services/hiring/internal/domain/policy"
    cross_domain_pkg: "services/hiring/internal/domain/interview"
    service_name: "HiringApplicationService"
    aggregate: "JobApplication"
    output_dir: "docs/architecture/c4-plant-uml/plantuml/code/backend"

  - name: "Interview Service"
    slug: "hiring-interview-service"
    container: "Hiring Service"
    title: "Interview Service (Hiring Domain)"
    description: "Планирование и проведение собеседований, фиксация оценок и управление видео-комнатами."
    usecase_pkg: "services/hiring/internal/usecase/interview"
    domain_pkg: "services/hiring/internal/domain/interview"
    subpackages:
      - "services/hiring/internal/usecase/interview/room"
    service_name: "HiringInterviewService"
    aggregate: "Interview"
    output_dir: "docs/architecture/c4-plant-uml/plantuml/code/backend"

  - name: "Offer Service"
    slug: "hiring-offer-service"
    container: "Hiring Service"
    title: "Offer Service (Hiring Domain)"
    description: "Формирование, отправка и принятие предложений о работе с межагрегатной транзакционной атомарностью."
    usecase_pkg: "services/hiring/internal/usecase/offer"
    domain_pkg: "services/hiring/internal/domain/offer"
    service_name: "HiringOfferService"
    aggregate: "JobOffer"
    output_dir: "docs/architecture/c4-plant-uml/plantuml/code/backend"


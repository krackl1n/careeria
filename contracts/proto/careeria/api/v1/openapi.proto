syntax = "proto3";

package careeria.api.v1;

import "careeria/api/v1/error.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/krackl1n/careeria/contracts/gen/careeria/api/v1;apiv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Careeria API"
    version: "1.0.0"
    description: "Общий HTTP API платформы Careeria. Контракт объединяет методы сервисов, через которые платформа и внешние системы получают и изменяют данные."
  }
  // Swagger UI позволяет выбрать схему запроса. Для локального запуска gateway
  // работает по HTTP, а в окружениях с TLS используется HTTPS.
  schemes: HTTP
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  responses: {
    key: "Error"
    value: {
      description: "Ошибка API Gateway."
      schema: {
        json_schema: {ref: ".careeria.api.v1.ErrorResponse"}
      }
    }
  }
  security_definitions: {
    security: {
      key: "BearerAuth"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Токен доступа в формате `Bearer <token>`."
      }
    }
  }
  security: {
    security_requirement: {
      key: "BearerAuth"
      value: {}
    }
  }
  tags: {
    name: "OAuth2 / OIDC"
    description: "Authorization Code flow, выпуск и отзыв токенов и OIDC UserInfo."
  }
  tags: {
    name: "Authentication UI"
    description: "Backend API экранов входа, работающих с authorization transaction."
  }
  tags: {
    name: "Identity session"
    description: "Просмотр и завершение текущей identity-сессии."
  }
  tags: {
    name: "Identity metadata"
    description: "OpenID Provider Configuration и публичный JSON Web Key Set."
  }
  tags: {
    name: "Registration"
    description: "Самостоятельная регистрация identity и запуск подтверждения контакта."
  }
};
